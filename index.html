<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel Bild Quiz</title>

    <link rel="stylesheet" href="my.css">
</head>

<body>

    <h1>🖼️ Artikel Bild Quiz</h1>

    <p>Willkommen zu meinem ICT Lernprogramm!</p>

    <div id="start-section">

        <input type="text" id="username" placeholder="Wie ist dein Name?">

        <button onclick="startQuiz()">Start</button>

    </div>

    <div id="quiz-section" style="display:none;">
        <p id="progress"></p>

        <img id="word-image" src="" alt="Bild">

        <h2 id="question"></h2>

        <input type="text" id="answer">

        <button id="confirm-btn" onclick="checkAnswer()">
        Bestätigen</button>

        <p id="feedback"></p>

        <p id="score"></p>

    </div>

    <script src="my.js"></script>

</body>

</html>
